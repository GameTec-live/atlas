# METABEGIN
# X-Env-Layer-Name: atlas-device-policy
# X-Env-Layer-Category: atlas
# X-Env-Layer-Desc: Serial console, Pi 5 PCIe policy and USB-first boot order.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: rpi-device-secpolicy,systemd-min
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu
      config="$1/boot/firmware/config.txt"
      if ! grep -q '^# Atlas device policy$' "$config"; then
        cat >> "$config" <<'EOF'
      
      # Atlas device policy
      [pi5]
      # Raspberry Pi 5 is not certified for Gen 3; remove this if the link is unstable.
      dtparam=pciex1_gen=3
      enable_uart=1
      
      [all]
      uart_2ndstage=1
      EOF
      fi
      chmod 0755 \
        "$1/usr/local/sbin/atlas-usb-boot-order" \
        "$1/usr/local/sbin/atlas-security-status"
      chmod 0644 "$1/usr/lib/systemd/system/atlas-usb-boot-order.service"
      install -d "$1/etc/systemd/system/getty.target.wants"
      ln -sfn /usr/lib/systemd/system/serial-getty@.service \
        "$1/etc/systemd/system/getty.target.wants/serial-getty@serial0.service"
    - $BDEBSTRAP_HOOKS/enable-units "$1" atlas-usb-boot-order.service
