# METABEGIN
# X-Env-Layer-Name: atlas-management
# X-Env-Layer-Category: atlas
# X-Env-Layer-Desc: Placeholder privileged Atlas system-management service.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: systemd-min
# METAEND
---
mmdebstrap:
  customize-hooks:
    - chmod 0755 "$1/usr/local/libexec/atlas-management"
    - chmod 0644 "$1/usr/lib/systemd/system/atlas-management.service"
    - $BDEBSTRAP_HOOKS/enable-units "$1" atlas-management.service
