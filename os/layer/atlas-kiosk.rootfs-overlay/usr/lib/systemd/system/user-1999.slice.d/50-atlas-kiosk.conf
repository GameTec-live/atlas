[Slice]
# pam_systemd moves the kiosk session out of atlas-kiosk.service and into this
# user slice. Repeat cgroup-based restrictions at the session's actual parent.
DevicePolicy=closed
DeviceAllow=/dev/tty0 rw
DeviceAllow=/dev/tty1 rw
DeviceAllow=char-drm rw
DeviceAllow=char-input rw
IPAddressDeny=any
IPAddressAllow=localhost
