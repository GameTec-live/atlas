name: Geodata API

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/geodataAPI/**"
      - ".github/workflows/geodata-api.yml"
  push:
    branches:
      - main
    paths:
      - "apps/geodataAPI/**"
      - ".github/workflows/geodata-api.yml"

permissions:
  contents: read

concurrency:
  group: geodata-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/geodataAPI
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/geodataAPI/go.mod
          cache-dependency-path: apps/geodataAPI/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set container image names
        id: image
        shell: bash
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}-geodata-api:latest" >> "$GITHUB_OUTPUT"
          echo "reloader=ghcr.io/${GITHUB_REPOSITORY,,}-geodata-reloader:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: apps/geodataAPI
          target: geodata-api
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          provenance: false
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},oci-mediatypes=false
          tags: ${{ steps.image.outputs.api }}

      - name: Build and publish reloader image
        uses: docker/build-push-action@v7
        with:
          context: apps/geodataAPI
          target: reloader
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          provenance: false
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},oci-mediatypes=false
          tags: ${{ steps.image.outputs.reloader }}
