name: Router

on:
  pull_request:
    branches:
      - main
    paths:
      - "assistive/router/**"
      - ".github/workflows/router.yml"
  push:
    branches:
      - main
    paths:
      - "assistive/router/**"
      - ".github/workflows/router.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-router:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: assistive/router/Dockerfile
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}
